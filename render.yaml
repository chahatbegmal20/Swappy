# Render Blueprint — deploy FastAPI without Docker.
# Dashboard: New → Blueprint → connect chahatbegmal20/Swappy
# Docs: docs/DEPLOYMENT.md

services:
  - type: web
    name: swappy-api
    runtime: python
    plan: free
    region: oregon
    rootDir: .
    buildCommand: python -V && pip install -r requirements-api.txt
    startCommand: python -V && PYTHONPATH=. uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_ENV
        value: staging
      - key: APP_DEBUG
        value: "false"
      - key: ALLOW_MOCK_STORAGE
        value: "true"
      - key: MONGO_DB_NAME
        value: swappy_staging
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRATION_MINUTES
        value: "1440"
      # Random secret — do NOT paste the local .env JWT_SECRET default
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Optional: Render usually injects RENDER_EXTERNAL_URL; BACKEND_URL auto-fills from it
      - key: BACKEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: CORS_ALLOW_ORIGINS
        sync: false
