name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight API test deps
        run: |
          python -m pip install --upgrade pip
          pip install \
            fastapi uvicorn pydantic pydantic-settings \
            python-jose passlib bcrypt httpx pytest python-dotenv \
            motor beanie "pymongo[srv]" dnspython boto3

      - name: Run focused API unit tests
        env:
          APP_ENV: development
          APP_DEBUG: "true"
          JWT_SECRET: ci-test-secret-not-for-production-use
          DATABASE_URL: mongodb://localhost:27017
          MONGO_DB_NAME: swappy_ci
          FRONTEND_URL: http://localhost:3000
          BACKEND_URL: http://127.0.0.1:8000
        run: |
          python -m pytest \
            tests/test_config_env_loading.py \
            tests/test_auth_url_resolution.py \
            tests/test_settings_runtime.py \
            -q

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: npm run build

  promote-note:
    name: Promote reminder
    runs-on: ubuntu-latest
    needs: [api-tests, web-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Staging then production
        run: |
          echo "CI green on main."
          echo "1) Confirm Railway + Vercel staging auto-deploy for this commit."
          echo "2) Smoke auth, trends, upload on staging."
          echo "3) Promote the same commit to production (Railway prod + Vercel prod)."
          echo "See docs/DEPLOYMENT.md"
